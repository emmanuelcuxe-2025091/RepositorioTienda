<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal</title>
    <link rel="stylesheet" th:href="@{/css/HomeStyle.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <h1><i class="bi bi-shop"></i> Tienda</h1>
    <div class="user-info">
        <div class="perfil-wrapper">
            <img th:src="${session.fotoUsuario}"
                 class="perfil-foto"
                 onclick="toggleMenu()"
                 alt="Perfil">
            <div class="perfil-menu" id="perfilMenu">
                <div class="perfil-menu-header">
                    <img th:src="${session.fotoUsuario}" class="perfil-menu-foto" alt="Perfil">
                    <div>
                        <p class="perfil-nombre" th:text="${session.usuarioLogueado}">Usuario</p>
                        <p class="perfil-rol" th:text="${session.rolUsuario}">Rol</p>
                    </div>
                </div>
                <hr>
                <a th:href="@{/login}" class="perfil-menu-salir">
                    <i class="bi bi-box-arrow-right"></i> Salir de sesión
                </a>
            </div>
        </div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <a href="#" class="menu-item active"><i class="bi bi-house-door"></i>Inicio</a>
        <a href="#" class="menu-item" onclick="cargarSeccion('/home/seccion/clientes', this)">
            <i class="bi bi-people"></i>Clientes</a>
        <a href="#" class="menu-item" onclick="cargarSeccion('/home/seccion/usuarios', this)">
            <i class="bi bi-person-gear"></i>Usuarios</a>
        <a href="#" class="menu-item" onclick="cargarSeccion('/home/seccion/productos', this)">
            <i class="bi bi-box-seam"></i>Productos</a>
        <a href="#" class="menu-item" onclick="cargarSeccion('/home/seccion/ventas', this)">
            <i class="bi bi-cart3"></i>Ventas</a>
        <a href="#" class="menu-item" onclick="cargarSeccion('/home/seccion/detalleVenta', this)">
            <i class="bi bi-receipt"></i>Detalle Venta</a>
    </aside>

    <main class="content">
        <div id="area-contenido">
            <div class="icono-central">
                <i class="bi bi-shop"></i>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/home.js}"></script>
<script>
    function toggleMenu() {
        document.getElementById('perfilMenu').classList.toggle('visible');
    }

    document.addEventListener('click', function(e) {
        const wrapper = document.querySelector('.perfil-wrapper');
        if (!wrapper.contains(e.target)) {
            document.getElementById('perfilMenu').classList.remove('visible');
        }
    });
</script>
</body>
</html>
