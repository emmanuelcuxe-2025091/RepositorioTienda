<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal</title>
    <link rel="stylesheet" th:href="@{/HomeStyle.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <h1><i class="bi bi-shop"></i> Tienda</h1>
        <div class="user-info">
            <span>Bienvenido, <strong th:text="${session.usuarioLogueado}">Usuario</strong></span>
            <a th:href="@{/login}" class="btn-logout"> <i class="bi bi-box-arrow-right"></i> Salir de sesión</a>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a th:href="@{/home}" class="menu-item active"><i class="bi bi-house-door"></i>Inicio</a>
            <a th:href="@{/clientes}" class="menu-item"><i class="bi bi-people"></i>Clientes</a>
            <a th:href="@{/usuarios}" class="menu-item"><i class="bi bi-person-gear"></i>Usuarios</a>
            <a th:href="@{/productos}" class="menu-item"><i class="bi bi-box-seam"></i>Productos</a>
            <a th:href="@{/ventas}" class="menu-item"><i class="bi bi-cart3"></i>Ventas</a>
            <a th:href="@{/detalleVenta}" class="menu-item"><i class="bi bi-receipt"></i>Detalle Venta</a>
        </aside>

        <main class="content">
            <div class="welcome-banner">
                <div>
                    <h2>¡Bienvenido!</h2>
                </div>
            </div>

            <div class="icono-central">
                <i class="bi bi-shop"></i>
            </div>
        </main>
    </div>

</body>
</html>
