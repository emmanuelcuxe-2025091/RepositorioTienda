<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/RegistroStyle.css}">
</head>
<body>
<div class="card">
    <div class="left">
        <i class="bi bi-person-add" style="font-size: 80px; color: white;"></i>
    </div>
    <div class="right">
        <h2>Registro</h2>
        <p class="subtitle">Crea tu cuenta para continuar</p>
        <div th:if="${success}" class="success">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/registro}" method="post">
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="contrasena" placeholder="Contraseña" required>
            <select name="rol" required>
                <option value="" disabled selected>Selecciona un rol</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
            </select>
            <button type="submit">Registrarse</button>
        </form>

        <div class="switch">
            <a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
</div>
</body>
</html>
